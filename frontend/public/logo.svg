<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="lensGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="8" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="18" y1="14" x2="30" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Hexagonal Lens Body -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#lensGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle civic grid/infrastructure lines -->
  <path d="M8 36L24 28L40 36" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 28V42" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- AI Focus Brackets / Lens Aperture Rays -->
  <path d="M12 14H16" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" opacity="0.8"/>
  <path d="M12 14V18" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" opacity="0.8"/>
  <path d="M36 14H32" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" opacity="0.8"/>
  <path d="M36 14V18" stroke="#38BDF8" stroke-width="1.75" stroke-linecap="round" opacity="0.8"/>

  <!-- Location Pin & AI Iris Combination -->
  <path d="M24 9C18.4772 9 14 13.4772 14 19C14 26 24 35 24 35C24 35 34 26 34 19C34 13.4772 29.5228 9 24 9Z" fill="url(#accentGrad)"/>
  
  <!-- Inner Optical Lens AI Core -->
  <circle cx="24" cy="18.5" r="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="24" cy="18.5" r="2.2" fill="#38BDF8"/>
</svg>
