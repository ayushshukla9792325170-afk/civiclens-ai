version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: civiclens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: civiclens_secret_password
      POSTGRES_DB: civiclens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens -d civiclens"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civiclens_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://civiclens:civiclens_secret_password@db:5432/civiclens
      SECRET_KEY: civiclens-docker-production-secret-key-replace-with-custom-random-value
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
      UPLOAD_DIR: ./uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civiclens_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads_data:
